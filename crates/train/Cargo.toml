[package]
name    = "reservoir-train"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["reservoir-core/std", "nalgebra/std", "rand/std", "rand/std_rng"]
libm = ["reservoir-core/libm", "nalgebra/libm"]
fixed_point = ["reservoir-core/fixed_point", "dep:fixed"]

[dependencies]
reservoir-core = { path = "../core", default-features = false }
nalgebra       = { version = "0.33.2", default-features = false, features = ["alloc"] }
rand = { version = "0.8", default-features = false, features = ["alloc", "small_rng"] } 
num-traits = "0.2.19"
fixed = { version = "1.29.0", optional = true }