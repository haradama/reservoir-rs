[package]
name = "reservoir-train"
description = "Training utilities for Echo State Networks: ridge/lasso readout solvers, ESN builder helpers, and optional static code generation for embedded inference."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository = "https://github.com/haradama/reservoir-rs/tree/main/crates/train"
documentation = "https://docs.rs/reservoir-train"
homepage = "https://github.com/haradama/reservoir-rs/tree/main/crates/train"
keywords = ["reservoir", "machine-learning", "data"]

[features]
default = ["std"]
std = [
    "reservoir-core/std",
    "reservoir-infer/std",
    "nalgebra/std",
    "rand/std",
    "rand/std_rng",
]
libm = [
    "reservoir-core/libm",
    "reservoir-infer/libm",
    "nalgebra/libm",
    "num-traits/libm",
]

[dependencies]
reservoir-core = {  workspace = true, default-features = false }
reservoir-infer = {  workspace = true, default-features = false }
nalgebra = { version = "0.33.2", default-features = false, features = [
    "alloc",
] }
rand = { version = "0.8", default-features = false, features = [
    "alloc",
    "small_rng",
] }
num-traits = { version = "0.2.19", default-features = false }

[dev-dependencies]
reservoir-datasets = { workspace = true }
