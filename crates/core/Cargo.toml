[package]
name = "reservoir-core"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository = "https://github.com/haradama/reservoir-rs/tree/main/crates/core"
documentation = "https://docs.rs/reservoir-core"
homepage = "https://github.com/haradama/reservoir-rs/tree/main/crates/core"
keywords = ["reservoir", "echo state network", "machine-learning", "data"]

[features]
default = ["std"]
std = ["alloc", "dep:nalgebra", "nalgebra/std", "num-traits/std"]
alloc = ["dep:nalgebra", "nalgebra/alloc"]
libm = ["num-traits/libm", "nalgebra/libm"]

[dependencies]
nalgebra = { version = "0.33.2", default-features = false, optional = true }
num-traits = { version = "0.2.19", default-features = false }