[package]
name = "reservoir-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["alloc", "nalgebra/std", "num-traits/std"]
alloc = ["nalgebra/alloc"]
libm = ["num-traits/libm", "nalgebra/libm"]

[dependencies]
heapless = "0.9.2"
nalgebra = { version = "0.33.2", default-features = false, optional = true }
num-traits = { version = "0.2.19", default-features = false }