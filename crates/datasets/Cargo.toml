[package]
name = "reservoir-datasets"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = ["rand/std", "rand/std_rng", "reservoir-core/std"]

[dependencies]
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
num-traits = { version = "0.2.19", default-features = false, features = [
    "libm",
] }
heapless = "0.9.2"
reservoir-core = { path = "../core", default-features = false }
