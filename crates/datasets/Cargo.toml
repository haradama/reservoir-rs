[package]
name = "reservoir-datasets"
description = "Small synthetic time-series datasets for reservoir computing experiments (Henon, Mackey-Glass, NARMA), with optional no_std-friendly features."
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository = "https://github.com/haradama/reservoir-rs/tree/main/crates/datasets"
documentation = "https://docs.rs/reservoir-datasets"
homepage = "https://github.com/haradama/reservoir-rs/tree/main/crates/datasets"
keywords = ["reservoir", "machine-learning", "data"]

[features]
default = ["std"]
std = ["rand/std", "rand/std_rng", "reservoir-core/std"]

[dependencies]
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
num-traits = { version = "0.2.19", default-features = false, features = [
    "libm",
] }
heapless = "0.9.2"
reservoir-core = { workspace = true, default-features = false }
